name: Compile unsigned iPhone code only
on:
  push:
    branches: [main]
    paths:
      - 'MiaowCompanion/**'
      - 'MiaowCompanion.xcodeproj/**'
      - '.github/workflows/unsigned-ios.yml'
      - 'audit_build.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: unsigned-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # Standard GitHub-hosted public-repository runners are free.
    # Never allocate a runner for a private repository whose quota is unknown.
    if: ${{ github.event.repository.visibility == 'public' && github.event.repository.private == false }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile device binary without Apple credentials or signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version | tee build-environment.txt
          xcodebuild -project MiaowCompanion.xcodeproj -scheme MiaowCompanion \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/MiaowBuild" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            ASSETCATALOG_COMPILER_APPICON_NAME= build 2>&1 | tee build.log
          APP="$RUNNER_TEMP/MiaowBuild/Build/Products/Release-iphoneos/MiaowCompanion.app"
          python3 audit_build.py "$APP"
          ditto -c -k --keepParent "$APP" unsigned-code-only.app.zip
          shasum -a 256 unsigned-code-only.app.zip | tee SHA256SUMS
      - name: Publish code-only result without Actions artifact storage
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="unsigned-code-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' 'Unsigned device code only. No pet photos, videos, Apple credentials, or provisioning profiles. Private media will be added locally before owner-side Windows signing.' > release-notes.txt
          gh release create "$TAG" unsigned-code-only.app.zip SHA256SUMS build.log build-environment.txt \
            --title 'Unsigned code-only iPhone build' --notes-file release-notes.txt
